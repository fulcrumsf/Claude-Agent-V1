name: neon-parcel-longform-compilation
version: 0.1.0
scope: neon-parcel-youtube-animal-compilations

production_naming:
  required_prefix: four_digit_sequence
  format: "NNNN_Title-With-Dashes"
  allocation: next_available_sequence_under_Productions
  preserve_explicit_prefix: true

defaults:
  generation_mode: image-first
  default_video_route: seedance_2_mini_storyboard_480p_then_topaz_2x_ffmpeg_1920x1080
  default_video_model: bytedance/seedance-2-mini
  default_video_resolution: 480p
  default_video_reference: neon_parcel_storyboard
  default_upscale: topaz_2x
  default_final_normalization: ffmpeg_1920x1080
  default_route_grade: 89
  default_route_grade_label: B+
  aspect_ratio: 16:9
  final_output_resolution: 1920x1080
  longform_target_minutes: [6, 8]
  shorts_target_seconds: 60
  shorts_target_is_soft: true
  shorts_overlay_frames: [1, 30]
  shorts_overlay_fps: 30
  music_provider: suno
  music_audio_policy: instrumental_only
  foley_provider: video_model_native_audio
  narrator_provider: elevenlabs
  publishing_provider: blotato
  prompt_archive_folder: Prompts
  prompt_contract: Templates/Seedance-Prompt-Contract.json
  prompt_contract_version: 1.0.0

approval_policy:
  candidate_selection: manual
  shot_list: required
  first_clip: required
  clips_two_through_five: required
  remaining_clip_batch: explicit_release
  narration_pass: required
  final_package: required
  publishing: explicit_release
  learned_patterns: manual_approval_before_activation

stages:
  - id: intake
    produces: [concept, generation_mode, reference_mode]
  - id: reference_candidates
    optional: true
    produces: [five_ranked_candidates, opportunity_badges]
  - id: case_study
    optional: true
    produces: [reference_video, transcript, keyframes, clip_boundaries, production_analysis]
  - id: learning_proposal
    optional: true
    produces: [proposed_humor_patterns, proposed_editing_patterns, negative_examples]
  - id: concept_grounding
    produces: [editorial_promise, scope, grounded_concepts, camera_contexts, ecology_checks]
    human_review_mode: iterative
  - id: shot_list
    produces: [brief, variable_duration_shot_list, diversity_ledger_seed]
  - id: physical_action_risk_filter
    runs_before: image_or_storyboard_generation
    produces: [physical_action_assessment, simplified_shot_or_risk_decision]
    rules:
      avoid_unnecessary_delicate_mechanics: true
      avoid_unnecessary_multi_step_object_manipulation: true
      require_believable_camera_operator: true
      prefer_observable_natural_outcome: true
      complexity_escalation_does_not_justify_avoidable_action: true
    blocking_risks: [fastening, untangling, measuring, precise_handoff, attachment, catching, two_handed_camera_conflict]
  - id: shot_complexity_routing
    runs_before: clip_generation
    produces: [shot_routing, complexity_scores, routing_reasons]
    assessment: semantic_scene_understanding
    keyword_matches_are_supporting_signals_only: true
    routes:
      default: seedance_2_mini_storyboard_480p_then_upscale
      simple: seedance_2_mini_storyboard_480p_then_upscale
      complex: seedance_2_mini_storyboard_480p_then_upscale
      legacy_fallback: seedance_1_5_start_end_1080p
      borderline: manual_review
    legacy_fallback_requires_explicit_override: true
    complex_postprocess:
      generation_resolution: 480p
      upscaler: topaz
      upscale_factor: 2x
      final_normalization: ffmpeg_1920x1080
    complex_storyboard:
      aspect_ratio: 16:9
      max_frames_per_segment: 6
      split_suffixes: [A, B, C, D]
      split_when_frame_count_exceeds_max: true
      neon_parcel_template:
        image_area_aspect_ratio: 16:9
        caption_band: white
        frame_number_location: below_image_in_caption_band
        description_location: below_image_in_caption_band
        numbers_inside_image: false
        descriptions_inside_image: false
        purpose: visual_continuity_reference_not_final_video_layout
    hard_triggers:
      - mechanical_interaction
      - object_transfer_or_attachment
      - catching_breaking_spilling
      - multi_step_ordered_action
    does_not_generate_or_spend_credits: true
  - id: pre_video_quality_gates
    runs_after: [image_or_storyboard_generation]
    runs_before: clip_generation
    produces: [visual_realism_assessment, camera_plausibility_assessment, meaningful_visual_beat_assessment, humor_context_assessment]
    required_status: pass
    uncertain_or_missing_status: blocked_for_human_review
    checks:
      visual_realism: [anatomy, materials, lighting, shadows, contact_and_scale, no_3d_render_appearance]
      camera_plausibility: [capture_source, operator_position, framing, lens_character, movement, fixed_geometry]
      meaningful_visual_beat: [setup, development, outcome, repetition_has_context_or_escalation]
      humor_context: [causal_dialogue, sincere_human_logic, understandable_event, visible_absurdity_or_reaction, no_random_props]
    generation_prompt_scope: [scene, camera, action, native_audio]
    post_production_only: [captions, title_cards, labels, rankings, emojis, watermarks]
    does_not_activate_learned_patterns: true
    storyboard_review_policy:
      agent_must_inspect_generated_sheet: true
      agent_must_report_frame_and_transition_findings: true
      provider_outputs_are_advisory_evidence_only: true
      never_auto_clear_storyboard: true
      never_auto_reject_storyboard: true
      user_decision_required_before_revision_or_video: true
      user_decision_options: [approve, request_revision, reject]
    video_inspection_policy:
      primary_provider: gemini_direct
      fallback_provider: openrouter
      short_clip_processing: static
      short_clip_sampling_fps: 3
      agentic_processing_for: [long_form_video, targeted_long_video_query]
      inspect_entire_timeline: true
      timestamped_findings_required: true
      provider_outputs_are_advisory_evidence_only: true
      never_auto_clear_video: true
      never_auto_reject_video: true
      user_decision_required_before_upscale_or_replacement: true
  - id: endpoint_frame_decision
    runs_after: [shot_complexity_routing]
    runs_before: [image_or_storyboard_generation, clip_generation]
    applies_to: seedance_1_5_start_end
    produces: [end_frame_decision, endpoint_reason]
    decisions: [use_end_frame, start_frame_only, manual_review]
    use_end_frame_requires: [materially_different_state, stable_camera_geometry, consistent_subject_count, clear_endpoint]
    start_frame_only_when: [end_frame_repeats_start, endpoint_confuses_interpolation, subject_should_exit_frame, geometry_would_disappear]
    missing_or_uncertain_evidence: manual_review
  - id: clip_generation
    produces: [clip_versions, clip_approvals, diversity_ledger]
    rules:
      reread_shared_seedance_skill_before_prompting: true
      reread_storyboard_generation_skill_before_prompting: true
      require_dual_skill_context: [Seedance-Prompting-Guide, Storyboard-Generation]
      require_neon_seedance_prompt_contract: true
      prompt_contract_sections_in_order: [camera_lock, scene_continuity, action_timeline, audio, hard_constraints]
      reject_unstructured_prompt_paragraph: true
      camera_and_action_must_be_separate: true
      action_timeline_must_be_chronological_and_observable: true
      every_moving_subject_requires_visible_origin: true
      every_moving_subject_requires_continuous_route: true
      environment_topology_must_be_checked_before_motion_prompting: true
      ambiguous_architecture_requires_scene_simplification: true
      storyboard_is_visual_continuity_only_by_default: true
      one_paid_provider_task_per_shot_version: true
      require_generation_log_lookup_before_submit: true
      retry_requires_provider_failure_corrupt_output_or_explicit_revision: true
      exact_prompt_must_be_saved_before_provider_submit: true
      prompt_file_required_per_shot_version: true
      prompt_file_must_include_model_resolution_references_parameters: true
      prompt_file_must_be_linked_to_task_id: true
      prompt_archive_is_immutable: true
      seedance_1_5_1080p_skips_topaz: true
      seedance_2_mini_480p_uses_topaz_2x_then_ffmpeg_1920x1080: true
      keep_only_final_normalized_versions_in_video_clips: true
      record_provider_and_upscale_task_ids: true
      pre_video_quality_gates_must_pass: true
      primary_storyboard_route_fallback: first_last_temporal_anchors_after_failed_video_inspection
      inspect_raw_video_before_upscale: true
      never_overwrite_paid_or_derived_artifact: true
      every_attempt_requires_new_version: true
      superseded_artifacts_move_to_archived_folder: true
  - id: rough_cut
    produces: [approved_rough_cut, clip_timeline]
  - id: editorial_narration
    produces: [narration_decisions, narration_script, narrator_audio]
  - id: music_and_sound
    produces: [music_prompt, music_audio, sound_design_notes]
    rules:
      native_video_model_audio_for_foley: true
      suno_for_instrumental_background_music_only: true
      suno_voice_or_lyrics: false
  - id: master_render
    produces: [master_version]
    output_resolution: 1920x1080
  - id: shorts_derivatives
    produces: [short_versions, short_boundaries, overlay_specifications]
  - id: packaging
    produces: [title, description, thumbnail, shorts_package, report_cards]
  - id: publish
    gated_by: final_package_approval
    produces: [blotato_publish_receipt]

artifact_rules:
  case_study_root: 002_Content-Creation/Video_Editor/002_Channels/002_Neon-Parcel/Case_Studies
  production_root: 002_Content-Creation/Video_Editor/002_Channels/002_Neon-Parcel/Production
  preserve_reference_video: true
  preserve_all_versions: true
  overwrite_approved_files: false
  superseded_unapproved_files: move_to_archived_folder
  archive_folder: Video_Clips/Archived
  delete_superseded_files: false
  active_video_clips_contains_current_versions_only: true
  applies_to_all_artifacts: true
  artifact_archive_subfolders: [Images/Archived, Prompts/Archived, Scripts/Archived, Working/Archived, Intermediate/Archived]
  preserve_original_version_number: true
  replacement_uses_next_version_number: true
  longform_part_titles: false
  shorts_part_titles: true

editorial_rules:
  concepts_must_be_camera_native: true
  concepts_must_have_believable_human_motivation: true
  concepts_must_pass_location_species_plausibility: true
  concepts_may_be_funny_shocking_or_compelling: true
  explicit_punchline_required: false
  variation_follows_compilation_subject: true
  default_geography_is_coherent: true
  human_decides_when_review_is_complete: true
  narration_is_optional_per_clip: true
  narration_written_after_rough_cut: true
  narration_must_stay_within_clip: true
  narrator_adds_perspective_not_obvious_description: true
  in_scene_dialogue_is_optional: true
  distinguish_in_camera_off_camera_and_background_voice: true
  no_payoff_under_short_overlay: true
  reference_style_not_overlay_content: true
  visual_realism_review_before_paid_video: true
  camera_plausibility_review_before_paid_video: true
  meaningful_visual_beat_required: true
  humor_context_review_before_paid_video: true
  dialogue_must_be_causally_grounded: true
  repetition_requires_escalation_or_context: true
  overlays_added_in_post_only: true

diversity_ledger:
  compare_before_each_prompt: true
  dimensions:
    - animal_appearance
    - species_or_breed
    - location
    - camera_and_lens
    - framing_and_motion
    - lighting
    - action_and_props
    - in_scene_voice
    - prompt_phrasing

quality_gates:
  - no_unapproved_paid_generation
  - no_clip_boundary_narration_cuts
  - no_short_mid_clip_cuts
  - no_unlicensed_source_reuse
  - no_automatic_learning_activation
  - no_blotato_publish_without_approval
  - no_random_prop_driven_concepts
  - no_implausible_camera_operator_or_viewpoint
  - no_ecologically_unbelievable_animal_setting
  - no_forced_geographic_variation
  - no_complex_shot_without_routing
  - no_borderline_shot_without_human_route_decision
  - no_keyword_only_complexity_route
  - no_storyboard_over_six_frames_per_segment
  - no_suno_foley_or_vocal_music
  - no_complex_shot_without_camera_lock_qa
  - no_pre_video_gate_without_structured_evidence
  - no_paid_generation_without_prompt_archive
  - no_duplicate_successful_or_pending_provider_task
  - no_topaz_for_native_1080p_seedance_1_5
  - no_superseded_unapproved_file_left_in_active_folder
  - no_superseded_file_deleted_instead_of_archived
  - no_avoidable_physics_risk_in_shot_idea
  - no_seedance_1_5_end_frame_without_endpoint_decision
  - no_speculative_seedance_1_5_end_frame
